<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Movie Library</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }

    body {
      background: #0b1120;
      color: #e2e8f0;
      padding: 25px 15px;
    }

    .container {
      max-width: 850px;
      margin: auto;
    }

    header {
      background: #172554;
      color: white;
      padding: 28px;
      border-radius: 12px;
      margin-bottom: 24px;
    }

    header h1 {
      margin-bottom: 8px;
    }

    header p {
      color: #bfdbfe;
    }

    .card {
      background: #111827;
      padding: 24px;
      border-radius: 12px;
      margin-bottom: 22px;
      box-shadow: 0 3px 12px #00000040;
    }

    h2 {
      font-size: 20px;
      margin-bottom: 18px;
    }

    .form-group {
      margin-bottom: 15px;
    }

    label {
      display: block;
      font-weight: bold;
      margin-bottom: 7px;
    }

    input,
    textarea,
    select {
      width: 100%;
      padding: 11px;
      border: 1px solid #334155;
      border-radius: 7px;
      font-size: 15px;
      background: #0f172a;
      color: #e2e8f0;
    }

    textarea {
      resize: vertical;
      min-height: 80px;
    }

    input:focus,
    textarea:focus,
    select:focus {
      outline: 2px solid #1e40af;
      border-color: #3b82f6;
    }

    button {
      border: none;
      padding: 10px 16px;
      border-radius: 7px;
      cursor: pointer;
      font-weight: bold;
    }

    button:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }

    .primary {
      background: #2563eb;
      color: white;
    }

    .secondary {
      background: #334155;
      color: #e2e8f0;
    }

    .edit {
      background: #172554;
      color: #93c5fd;
    }

    .delete {
      background: #450a0a;
      color: #fca5a5;
    }

    .message {
      padding: 12px;
      border-radius: 7px;
      margin-bottom: 15px;
      display: none;
    }

    .success {
      display: block;
      background: #052e16;
      color: #86efac;
    }

    .error {
      display: block;
      background: #450a0a;
      color: #fca5a5;
    }

    .loading {
      text-align: center;
      padding: 18px;
      color: #60a5fa;
    }

    .item {
      border: 1px solid #334155;
      border-radius: 9px;
      padding: 17px;
      margin-bottom: 13px;
      background: #0f172a;
    }

    .item h3 {
      color: #60a5fa;
      font-size: 18px;
      margin-bottom: 9px;
      overflow-wrap: anywhere;
    }

    .item p {
      color: #cbd5e1;
      margin-bottom: 8px;
      overflow-wrap: anywhere;
    }

    .item-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      margin-bottom: 10px;
    }

    .status {
      font-size: 12px;
      font-weight: bold;
      padding: 5px 10px;
      border-radius: 20px;
      white-space: nowrap;
    }

    .To-Watch {
      background: #172554;
      color: #93c5fd;
    }

    .Watching {
      background: #422006;
      color: #fde68a;
    }

    .Watched {
      background: #052e16;
      color: #86efac;
    }

    .actions,
    .form-actions {
      display: flex;
      gap: 9px;
      flex-wrap: wrap;
      margin-top: 12px;
    }

    .empty {
      text-align: center;
      padding: 25px 0;
      color: #94a3b8;
    }

    .count {
      color: #94a3b8;
      font-size: 14px;
      margin-top: -10px;
      margin-bottom: 16px;
    }

    @media (max-width: 500px) {
      .card {
        padding: 17px;
      }

      header {
        padding: 22px;
      }
    }
  </style>
</head>

<body>

  <div class="container">

    <header>
      <h1>Movie Library</h1>
      <p>Add, track, and manage your favorite movies.</p>
    </header>

    <div class="card">

      <h2 id="formTitle">Add a Movie</h2>

      <div id="message" class="message" role="status" aria-live="polite"></div>

      <form id="itemForm">

        <div class="form-group">
          <label for="itemName">Movie Title</label>
          <input
            type="text"
            id="itemName"
            placeholder="Enter movie title"
            required
          >
        </div>

        <div class="form-group">
          <label for="description">Description</label>
          <textarea
            id="description"
            placeholder="Describe the movie"
            required
          ></textarea>
        </div>

        <div class="form-group">
          <label for="location">Genre</label>
          <input
            type="text"
            id="location"
            placeholder="e.g. Action, Comedy, Romance"
            required
          >
        </div>

        <div class="form-group">
          <label for="status">Status</label>

          <select id="status" required>
            <option value="To-Watch">To Watch</option>
            <option value="Watching">Watching</option>
            <option value="Watched">Watched</option>
          </select>

        </div>

        <div class="form-actions">
          <button
            type="submit"
            class="primary"
            id="submitBtn"
          >
            Add Movie
          </button>

          <button
            type="button"
            class="secondary"
            id="cancelBtn"
            hidden
          >
            Cancel
          </button>
        </div>

      </form>

    </div>

    <div class="card">

      <h2>Movie List</h2>

      <p class="count" id="itemCount">
        0 movie(s)
      </p>

      <div
        id="loading"
        class="loading"
        hidden
      >
        Loading movies...
      </div>

      <div id="itemList"></div>

    </div>

  </div>


  <script>

    // API endpoint
    const API_URL =
      "https://jsonplaceholder.typicode.com/posts";


    // HTML elements
    const itemForm =
      document.getElementById("itemForm");

    const itemList =
      document.getElementById("itemList");

    const itemCount =
      document.getElementById("itemCount");

    const message =
      document.getElementById("message");

    const loading =
      document.getElementById("loading");

    const formTitle =
      document.getElementById("formTitle");

    const submitBtn =
      document.getElementById("submitBtn");

    const cancelBtn =
      document.getElementById("cancelBtn");


    // Application data
    let items = [];

    let editingId = null;


    // Show messages
    function showMessage(text, type) {

      message.textContent = text;

      message.className =
        "message " + type;

    }


    function clearMessage() {

      message.textContent = "";

      message.className = "message";

    }


    // Loading indicator
    function setLoading(state) {

      loading.hidden = !state;

    }


    // Convert API data into a movie
    function formatItem(data) {

      let details = {};

      if (typeof data.body === "string") {

        try {

          details = JSON.parse(data.body);

        } catch (e) {

          details = {};

        }

      } else if (typeof data.body === "object") {

        details = data.body;

      }


      return {

        id: data.id || Date.now(),

        name: data.title || data.name,

        description:
          details.description ||
          data.description ||
          "",

        location:
          details.location ||
          data.location ||
          "Not specified",

        status:
          details.status ||
          data.status ||
          "To-Watch"

      };

    }


    // READ
    async function getItems() {

      setLoading(false);

      clearMessage();

      items = [];

      renderItems();

    }


    // Display all movies
    function renderItems() {

      itemList.replaceChildren();

      itemCount.textContent =
        items.length + " movie(s)";


      if (items.length === 0) {

        const empty =
          document.createElement("p");

        empty.className = "empty";

        empty.textContent =
          "No movies available.";

        itemList.appendChild(empty);

        return;

      }


      items.forEach(item => {

        const card =
          document.createElement("div");

        card.className = "item";


        const top =
          document.createElement("div");

        top.className = "item-top";


        const name =
          document.createElement("h3");

        name.textContent =
          item.name;


        const status =
          document.createElement("span");

        status.className =
          "status " + item.status;

        status.textContent =
          item.status.replace("-", " ");


        top.append(name, status);


        const description =
          document.createElement("p");

        description.textContent =
          "Description: " +
          item.description;


        const genre =
          document.createElement("p");

        genre.textContent =
          "Genre: " +
          item.location;


        const actions =
          document.createElement("div");

        actions.className =
          "actions";


        const editBtn =
          document.createElement("button");

        editBtn.className = "edit";

        editBtn.textContent = "Edit";

        editBtn.addEventListener(
          "click",
          () => editItem(item.id)
        );


        const deleteBtn =
          document.createElement("button");

        deleteBtn.className = "delete";

        deleteBtn.textContent = "Delete";

        deleteBtn.addEventListener(
          "click",
          () => deleteItem(item.id)
        );


        actions.append(
          editBtn,
          deleteBtn
        );


        card.append(
          top,
          description,
          genre,
          actions
        );


        itemList.appendChild(card);

      });

    }


    // CREATE: Add movie using POST
    async function addItem(item) {

      submitBtn.disabled = true;

      submitBtn.textContent =
        "Adding...";

      clearMessage();


      try {

        const response =
          await fetch(API_URL, {

            method: "POST",

            headers: {
              "Content-Type":
                "application/json"
            },

            body: JSON.stringify({

              title: item.name,

              body: JSON.stringify({

                description:
                  item.description,

                location:
                  item.location,

                status:
                  item.status

              }),

              userId: 1

            })

          });


        if (!response.ok) {

          throw new Error(
            "Failed to add movie."
          );

        }


        const data =
          await response.json();


        items.unshift(
          formatItem(data)
        );


        renderItems();

        itemForm.reset();


        showMessage(
          "Movie added successfully!",
          "success"
        );


      } catch (error) {

        showMessage(
          error.message,
          "error"
        );

      } finally {

        submitBtn.disabled = false;

        submitBtn.textContent =
          "Add Movie";

      }

    }


    // Prepare movie for editing
    function editItem(id) {

      const item =
        items.find(
          record => record.id === id
        );


      if (!item) return;


      editingId = id;


      document.getElementById(
        "itemName"
      ).value = item.name;


      document.getElementById(
        "description"
      ).value = item.description;


      document.getElementById(
        "location"
      ).value = item.location;


      document.getElementById(
        "status"
      ).value = item.status;


      formTitle.textContent =
        "Update Movie";


      submitBtn.textContent =
        "Save Changes";


      cancelBtn.hidden = false;


      clearMessage();


      window.scrollTo({
        top: 0,
        behavior: "smooth"
      });

    }


    // UPDATE: Edit movie using PUT
    async function updateItem(item) {

      submitBtn.disabled = true;

      submitBtn.textContent =
        "Updating...";

      clearMessage();


      try {

        const response =
          await fetch(
            API_URL + "/" + editingId,
            {

              method: "PUT",

              headers: {
                "Content-Type":
                  "application/json"
              },

              body: JSON.stringify({

                id: editingId,

                title: item.name,

                body: JSON.stringify({

                  description:
                    item.description,

                  location:
                    item.location,

                  status:
                    item.status

                }),

                userId: 1

              })

            }
          );


        if (!response.ok) {

          throw new Error(
            "Failed to update movie."
          );

        }


        const data =
          await response.json();


        const updatedItem =
          formatItem(data);


        items = items.map(
          record =>
            record.id === editingId
              ? updatedItem
              : record
        );


        renderItems();

        resetForm();


        showMessage(
          "Movie updated successfully!",
          "success"
        );


      } catch (error) {

        showMessage(
          error.message,
          "error"
        );

      } finally {

        submitBtn.disabled = false;

        submitBtn.textContent =
          "Add Movie";

      }

    }


    // DELETE: Remove movie using DELETE
    async function deleteItem(id) {

      if (
        !confirm(
          "Are you sure you want to delete this movie?"
        )
      ) {

        return;

      }


      clearMessage();


      const buttons =
        itemList.querySelectorAll(
          "button"
        );


      buttons.forEach(
        button =>
          button.disabled = true
      );


      try {

        const response =
          await fetch(
            API_URL + "/" + id,
            {
              method: "DELETE"
            }
          );


        if (!response.ok) {

          throw new Error(
            "Failed to delete movie."
          );

        }


        items =
          items.filter(
            item => item.id !== id
          );


        renderItems();


        showMessage(
          "Movie deleted successfully!",
          "success"
        );


      } catch (error) {

        showMessage(
          error.message,
          "error"
        );

        renderItems();

      }

    }


    // Reset form
    function resetForm() {

      itemForm.reset();

      editingId = null;

      formTitle.textContent =
        "Add a Movie";

      submitBtn.textContent =
        "Add Movie";

      cancelBtn.hidden = true;

    }


    // Cancel editing
    cancelBtn.addEventListener(
      "click",
      () => {

        resetForm();

        clearMessage();

      }
    );


    // Handle form submission
    itemForm.addEventListener(
      "submit",
      async event => {

        event.preventDefault();


        const item = {

          name:
            document.getElementById(
              "itemName"
            ).value.trim(),

          description:
            document.getElementById(
              "description"
            ).value.trim(),

          location:
            document.getElementById(
              "location"
            ).value.trim(),

          status:
            document.getElementById(
              "status"
            ).value

        };


        if (
          !item.name ||
          !item.description ||
          !item.location
        ) {

          showMessage(
            "Please complete all fields.",
            "error"
          );

          return;

        }


        if (editingId !== null) {

          await updateItem(item);

        } else {

          await addItem(item);

        }

      }
    );


    // Load movies when page opens
    getItems();

  </script>

</body>
</html>
